name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The browser tests (test_reader.py, test_quiz.py) need Playwright and Chromium, so they stay local.
    # Windows is left out: the server tests run a fake `claude` script through its shebang, which Windows can't do.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Release check
        run: python tests/test_release.py
      - name: Server, opener and library tests
        working-directory: skills/visual-teach/scripts
        run: python -m unittest -v test_serve test_open_course test_library
